<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sea · 水上慢生活</title>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #072d78;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 手绘水彩纸张肌理与边缘柔光叠层 */
    .painterly-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      background:
        radial-gradient(circle at 52% 44%, rgba(255, 248, 220, 0.04) 0%, rgba(9, 52, 130, 0.14) 76%, rgba(5, 28, 86, 0.34) 100%),
        repeating-linear-gradient(35deg, rgba(255, 255, 255, 0.013) 0px, rgba(255, 255, 255, 0.013) 2px, transparent 2px, transparent 6px);
      mix-blend-mode: soft-light;
    }

    /* 顶部紧凑 HUD 栏 */
    .hud-bar {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-pill {
      pointer-events: auto;
      background: rgba(8, 28, 64, 0.68);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(118, 235, 220, 0.38);
      border-radius: 13px;
      padding: 8px 14px;
      color: #f4fbff;
      box-shadow: 0 8px 26px rgba(4, 22, 58, 0.38);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #48f0c8;
      box-shadow: 0 0 10px #48f0c8;
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #ffffff;
    }
    .brand-sub {
      font-size: 10.5px;
      color: rgba(205, 238, 255, 0.85);
      margin-top: 1px;
    }

    .controls-group {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(8, 28, 64, 0.68);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(118, 235, 220, 0.38);
      border-radius: 13px;
      padding: 5px 7px;
      box-shadow: 0 8px 26px rgba(4, 22, 58, 0.38);
      flex-wrap: wrap;
    }

    .hud-btn {
      appearance: none;
      border: 1px solid rgba(132, 226, 236, 0.28);
      background: rgba(22, 62, 120, 0.58);
      color: #e9f8ff;
      font-size: 11.5px;
      font-weight: 600;

    }
    .hud-btn:hover {
      background: rgba(44, 114, 192, 0.82);
      border-color: rgba(124, 248, 228, 0.7);
      transform: translateY(-1px);
    }
    .hud-btn.active {
      background: linear-gradient(135deg, #28c8b4, #1b88e5);
      color: #ffffff;
      border-color: #9affef;
      box-shadow: 0 0 14px rgba(40, 200, 180, 0.45);
    }

    /* 原画参考小窗 */
    .ref-card {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 10;
      width: 265px;
      background: rgba(8, 28, 64, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(118, 235, 220, 0.45);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 12px 32px rgba(3, 18, 48, 0.52);
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: bottom right;
    }
    .ref-card.hidden {
      opacity: 0;
      transform: scale(0.88) translateY(12px);
      pointer-events: none;
    }
    .ref-card-header {
      display: flex;
      justify-content: space-between;

      color: #bcefff;
      margin-bottom: 6px;
      padding: 0 4px;

    }
    .ref-card img {
      width: 100%;
      height: auto;

      border: 1px solid rgba(255, 255, 255, 0.22);

    /* 底部操作提示条 */
    .hint-pill {
      position: fixed;
      bottom: 14px;
      left: 14px;
      z-index: 10;
      pointer-events: none;
      background: rgba(8, 28, 64, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(118, 235, 220, 0.3);
      border-radius: 11px;
      padding: 7px 13px;
      color: rgba(230, 247, 255, 0.92);
      font-size: 11.5px;
      display: flex;

      gap: 12px;
      box-shadow: 0 6px 20px rgba(4, 22, 58, 0.3);
    }
    .key-badge {
      display: inline-block;
      background: rgba(120, 238, 225, 0.2);
      border: 1px solid rgba(120, 238, 225, 0.48);
      color: #84fff0;

      padding: 1px 6px;
      font-size: 10.5px;

      margin-right: 4px;
    }
  </style>

<body>
  <div id="canvas-container"></div>
  <section id="dive-hud" aria-label="潜水探索">
    <button id="dive-button" type="button">潜水</button>
    <div id="dive-aim-hint" hidden>在所在水域按潜水直接下潜</div>
    <div id="dive-controls" hidden>
      <div id="dive-depth">深度 0.0 m</div>
      <div class="dive-pad"><button id="dive-forward" aria-label="向前游">↑</button><button id="dive-up" aria-label="上浮">上浮</button><button id="dive-left" aria-label="向左游">←</button><button id="dive-down" aria-label="下潜">下潜</button><button id="dive-right" aria-label="向右游">→</button><button id="dive-back" aria-label="向后游">↓</button></div>
      <p>WASD 游动 · E 上浮 · Q 下潜</p><span>点击宝箱自动游近搜索 · 方向键取消自动游动</span>
    </div>
  </section>
  <div id="dive-progress" hidden><span class="dive-progress-title">正在搜索</span><div class="dive-ring"><b>搜索</b></div></div>
  <div id="dive-found" role="status" aria-live="polite"></div>
  <div class="painterly-overlay"></div>
  <div class="gesture-hint">拖动旋转 · 右键平移 · 滚轮缩放</div>

  <!-- 顶部控制栏 -->
  <div class="hud-bar">
    <div class="brand-pill">
      <span class="brand-dot"></span>
      <div>
        <div class="brand-title">sea</div>
        <div class="brand-sub">一片小小水域，一段慢慢的生活</div>
      </div>
    </div>

    <div class="controls-group">
      <button class="hud-btn active" id="btn-cam-original" title="严格对齐原画俯视构图">
        <span>🎨 原画构图视角</span>
      </button>
      <button class="hud-btn" id="btn-cam-boat" title="跟随水道中的黄色快艇">
        <span>🚤 快艇特写视角</span>
      </button>
      <button class="hud-btn" id="btn-cam-orbit" title="环绕全景观察立体水下楼群与飞鸟">
        <span>🕊️ 全景环绕视角</span>
      </button>
      <button class="hud-btn active" id="btn-boat-toggle" title="切换小船巡航/原位驻留">
        <span>⚓ 航行：原位摇曳</span>

      <button class="hud-btn" id="btn-ref-toggle" title="显示或隐藏右下角原画对比框">

  </div>

  <!-- 左下角交互提示 -->
  <div class="hint-pill">
    <span><b class="key-badge">左键拖拽</b>旋转视角</span>
    <span><b class="key-badge">右键拖拽</b>平移画布</span>
    <span><b class="key-badge">滚轮</b>缩放景深</span>
    <span>悬停模型后点击卡片操作</span>
  </div>

  <!-- 右下角原画参考卡片 -->
  <div class="ref-card hidden" id="ref-card">
    <div class="ref-card-header">
      <span>原画参考 (Original Concept)</span>
      <span style="cursor:pointer;color:#7ef5e2" id="ref-close">✕</span>
    </div>
    <img src="./reference.png" alt="参考原画" />
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { initSeaGameplay } from './gameplay.js';
    import { refineScene } from './scene-art.js';
    import { arrangeHarbor } from './harbor-layout.js';
    import { polishHarbor } from './living-harbor.js';
    import { createWaterDistrict } from './water-district.js';
    import { createStylizedWater } from './water.js';
    import { createDiving } from './diving.js';
    import { createFirstRegion } from './first-region.js';

    // ============================================================================
    // 1. 渲染器、场景与原画精确相机对齐
    // ============================================================================
    const WATER_LEVEL = 1.12;
    const globalUniforms = {
      uTime: { value: 0 },
      uUnderwaterView: { value: 0 },
      uWaterLevel: { value: WATER_LEVEL }
    };

    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    // 深邃群青底色（还原原画中央水道深不见底的群青/钴蓝色调）
    scene.background = new THREE.Color('#176d9a');
    // 柔和深海雾效：拉远后仍能读到周边群落，最远处自然融入群青深海
    scene.fog = new THREE.Fog('#176d9a', 200, 520);

    const camera = new THREE.PerspectiveCamera(
      31,
      window.innerWidth / window.innerHeight,
      0.5,
      600
    );

    // 再拉远一档的高角度俯视机位：让第二区域、断桥与水下城市形成完整阅读层次
    const ORIGINAL_CAM_POS = new THREE.Vector3(-53.55, 78.12, 53.35);
    const ORIGINAL_CAM_TARGET = new THREE.Vector3(0.45, 1.75, -0.65);

    camera.position.copy(ORIGINAL_CAM_POS);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(ORIGINAL_CAM_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minPolarAngle = controls.maxPolarAngle = Math.PI / 4;
    controls.minAzimuthAngle = controls.maxAzimuthAngle = -Math.PI / 4;
    controls.enableRotate = false;
    controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
    // 允许滚轮在较宽范围内微调远近，既能看清区域也能拉远读完整张地图
    controls.enableZoom = true;
    controls.minDistance = 30;
    controls.maxDistance = 98;
    controls.update();

    // ============================================================================
    // 2. 手绘动画风灯光系统
    // ============================================================================
    const hemiLight = new THREE.HemisphereLight('#fff6d6', '#184fb8', 1.42);
    hemiLight.position.set(0, 50, 0);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight('#fff1be', 2.55);
    sunLight.position.set(21, 55, 16);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 5;
    sunLight.shadow.camera.far = 160;
    const d = 65;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight('#a3d9cf', 0.48);
    fillLight.position.set(-25, 14, -18);
    scene.add(fillLight);

    const violetShadowLight = new THREE.DirectionalLight('#8b91c6', 0.36);
    violetShadowLight.position.set(-18, 20, 22);
    scene.add(violetShadowLight);

    // ============================================================================
    // 3. 程序化手绘纹理与水深垂直消光着色器注入（Depth Color Extinction & Caustics）
    // ============================================================================
    function createToonGradientMap() {
      const data = new Uint8Array([
        65, 112, 196, 255,
        134, 180, 235, 255,
        218, 238, 250, 255,
        255, 253, 242, 255
      ]);
      const tex = new THREE.DataTexture(data, 4, 1, THREE.RGBAFormat);
      tex.minFilter = THREE.NearestFilter;
      tex.magFilter = THREE.NearestFilter;
      tex.needsUpdate = true;
      return tex;
    }
    const toonGradientMap = createToonGradientMap();

    // 关键细节升级：为所有水下建筑与物体的材质注入真实的「水深色彩分层与焦散波光」！
    // 让建筑在吃水线附近呈现亮松石绿 (#5bf5dc)，浅水呈翡翠青 (#20b8c2)，中深水呈钴蓝 (#0e52ad)，深渊呈群青紫蓝 (#062368)
    function enhanceWithUnderwaterDepthShader(mat) {
      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = globalUniforms.uTime;
        shader.uniforms.uUnderwaterView = globalUniforms.uUnderwaterView;
        shader.uniforms.uWaterLevel = globalUniforms.uWaterLevel;

        shader.vertexShader = `
          varying vec3 vCustomWorldPos;
        ` + shader.vertexShader.replace(
          '#include <worldpos_vertex>',
          `
          #include <worldpos_vertex>
          vec4 depthWorldPosition = vec4(transformed, 1.0);
          #ifdef USE_INSTANCING
            depthWorldPosition = instanceMatrix * depthWorldPosition;
          #endif
          vCustomWorldPos = (modelMatrix * depthWorldPosition).xyz;
          `
        );

        shader.fragmentShader = `
          uniform float uTime;
          uniform float uWaterLevel;
          uniform float uUnderwaterView;
          varying vec3 vCustomWorldPos;
        ` + shader.fragmentShader.replace(
          '#include <dithering_fragment>',
          `
          #include <dithering_fragment>
          if (vCustomWorldPos.y < uWaterLevel && uUnderwaterView < .5) {
            float depth = uWaterLevel - vCustomWorldPos.y;

            // 四层手绘水深色彩梯度：亮青绿 -> 孔雀蓝 -> 深钴蓝 -> 深海靛紫
            vec3 cRim     = vec3(0.35, 0.96, 0.85);
            vec3 cShallow = vec3(0.12, 0.75, 0.78);
            vec3 cMid     = vec3(0.06, 0.34, 0.72);
            vec3 cAbyss   = vec3(0.03, 0.14, 0.42);

            float t1 = smoothstep(0.0, 2.2, depth);
            float t2 = smoothstep(2.2, 6.8, depth);
            float t3 = smoothstep(6.8, 15.5, depth);

            vec3 depthTint = mix(cRim, cShallow, t1);
            depthTint = mix(depthTint, cMid, t2);
            depthTint = mix(depthTint, cAbyss, t3);

            // 随水深增强的水体色彩融合
            float absorb = clamp(depth / 12.5, 0.0, 0.92);
            gl_FragColor.rgb = mix(gl_FragColor.rgb, depthTint, absorb * 0.48);

            // 浅水区手绘焦散游走光斑 (Underwater Sun Caustics)
            float cWave1 = sin(vCustomWorldPos.x * 1.45 + uTime * 2.1 + sin(vCustomWorldPos.z * 1.2));
            float cWave2 = cos(vCustomWorldPos.z * 1.55 - uTime * 1.7 + cos(vCustomWorldPos.x * 1.1));
            float causticNet = smoothstep(0.62, 0.86, (cWave1 + cWave2) * 0.5);
            float shallowMask = (1.0 - smoothstep(0.2, 6.5, depth)) * smoothstep(0.0, 0.35, depth);
            gl_FragColor.rgb += vec3(0.28, 0.92, 0.85) * causticNet * shallowMask * 0.12;

            // 紧贴吃水线的手绘物体边缘白色水花线 (Crisp Object-Edge Waterline Foam)
            float edgeNoise = sin(vCustomWorldPos.x * 3.8 + vCustomWorldPos.z * 3.2 + uTime * 2.4) * 0.045;
            float foamThickness = 0.16 + edgeNoise;
            float primaryEdgeFoam = 1.0 - smoothstep(0.02, max(0.05, foamThickness), depth);
            // 紧贴吃水线下方的一道极细手绘副水线
            float subEdgeLine = (1.0 - smoothstep(0.0, 0.045, abs(depth - (0.32 + edgeNoise * 1.3)))) *
                                step(0.15, sin(vCustomWorldPos.x * 2.2 - vCustomWorldPos.z * 2.6 + uTime * 1.8));
            float edgeFoamMask = clamp(primaryEdgeFoam * 0.92 + subEdgeLine * 0.58, 0.0, 1.0);
            gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(0.96, 1.0, 0.99), edgeFoamMask);
          }
          `
        );
      };
      return mat;
    }

    function makePainterlyMat(colorHex, opts = {}, applyDepthTint = false) {
      const mat = new THREE.MeshToonMaterial({
        color: new THREE.Color(colorHex),
        gradientMap: toonGradientMap,
        ...opts
      });
      if (applyDepthTint) enhanceWithUnderwaterDepthShader(mat);
      return mat;
    }

    function addEdgeHighlight(mesh, edgeColor = '#5df5dc', opacity = 0.45) {
      const edgesGeo = new THREE.EdgesGeometry(mesh.geometry, 26);
      const edgesMat = new THREE.LineBasicMaterial({
        color: edgeColor,
        transparent: true,
        opacity: Math.min(opacity, 0.22)
      });
      const line = new THREE.LineSegments(edgesGeo, edgesMat);
      mesh.add(line);
      return line;
    }

    // 生成手绘涂鸦墙面纹理（还原右上角黄色斑驳墙体、粉红泡泡涂鸦与青绿 "Kem-B..."）
    function createGraffitiWallTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 256;
      const ctx = c.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 512, 256);
      grad.addColorStop(0, '#d2a250');
      grad.addColorStop(0.55, '#e7c365');
      grad.addColorStop(1, '#988c6c');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 256);

      // 水彩剥落与青苔斑块
      const blotches = [
        { x: 30, y: 20, w: 95, h: 75, col: 'rgba(138, 92, 58, 0.48)' },
        { x: 195, y: 115, w: 160, h: 95, col: 'rgba(76, 168, 142, 0.45)' },
        { x: 360, y: 25, w: 120, h: 120, col: 'rgba(182, 118, 66, 0.4)' },
        { x: 95, y: 145, w: 190, h: 85, col: 'rgba(58, 146, 134, 0.48)' },
        { x: 10, y: 170, w: 490, h: 80, col: 'rgba(85, 112, 148, 0.45)' }
      ];
      blotches.forEach(b => {
        ctx.fillStyle = b.col;
        ctx.fillRect(b.x, b.y, b.w, b.h);
      });

      // 粉红色泡泡字涂鸦标签（还原原画窗框右侧的粉红涂鸦）
      ctx.strokeStyle = '#d4486a';
      ctx.lineWidth = 6;
      ctx.font = 'bold 34px sans-serif';
      ctx.strokeText('PKO', 82, 132);

      // 标志性青绿涂鸦大字 "Kem-B"
      ctx.save();
      ctx.translate(158, 110);
      ctx.rotate(-0.08);
      ctx.font = 'italic 900 84px "Comic Sans MS", "Chalkboard SE", sans-serif';
      ctx.lineWidth = 11;
      ctx.strokeStyle = '#146674';
      ctx.strokeText('Kem-B', 0, 0);
      ctx.fillStyle = '#2ef7bf';
      ctx.fillText('Kem-B', 0, 0);
      ctx.restore();

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 生成太阳能板手绘纹理（蓝紫电芯 + 暖橙斜刷高光 + 亮白铝框）
    function createSolarPanelTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, '#4166c8');
      grad.addColorStop(0.45, '#6494ee');
      grad.addColorStop(0.75, '#99c6ff');
      grad.addColorStop(1, '#4c6dc2');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      // 暖白与金橙斜向反光笔触（还原原画太阳能板上的金橙色反光块）
      ctx.fillStyle = 'rgba(255, 246, 212, 0.46)';
      ctx.beginPath();
      ctx.moveTo(35, 512);
      ctx.lineTo(285, 0);
      ctx.lineTo(375, 0);
      ctx.lineTo(135, 512);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = 'rgba(245, 165, 78, 0.54)';
      ctx.beginPath();
      ctx.moveTo(240, 512);
      ctx.lineTo(450, 155);
      ctx.lineTo(512, 225);
      ctx.lineTo(340, 512);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#dff0ff';
      ctx.lineWidth = 12;
      ctx.strokeRect(6, 6, 500, 500);
      for (let i = 1; i < 4; i++) {
        const x = (512 / 4) * i;
        ctx.lineWidth = 9;
        ctx.strokeStyle = '#314474';
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 512);
        ctx.stroke();

        ctx.lineWidth = 4;
        ctx.strokeStyle = '#d6ecff';
        ctx.beginPath();
        ctx.moveTo(x - 3, 0);
        ctx.lineTo(x - 3, 512);
        ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(218, 240, 255, 0.55)';
      ctx.lineWidth = 3;
      for (let j = 1; j < 4; j++) {
        const y = (512 / 4) * j;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(512, y);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 生成手绘水彩建筑立面纹理
    function createBuildingFacadeTexture(baseColor, darkColor, windowColor) {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 512;
      const ctx = c.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, baseColor);
      grad.addColorStop(0.32, '#1ca8a2');
      grad.addColorStop(0.7, '#0f5fb0');
      grad.addColorStop(1, darkColor);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 512);

      // 错落有致的深色窗洞与青色窗台亮线
      for (let row = 0; row < 7; row++) {
        for (let col = 0; col < 3; col++) {
          const wx = 24 + col * 74;
          const wy = 34 + row * 66;
          ctx.fillStyle = windowColor;
          ctx.fillRect(wx, wy, 54, 44);
          ctx.strokeStyle = 'rgba(78, 242, 220, 0.62)';
          ctx.lineWidth = 3.5;
          ctx.strokeRect(wx, wy, 54, 44);
          // 窗内竖向分隔框
          ctx.fillStyle = 'rgba(58, 210, 198, 0.42)';
          ctx.fillRect(wx + 25, wy, 3, 44);
        }
      }

      // 手绘水彩竖向斑驳笔触
      for (let i = 0; i < 22; i++) {
        ctx.fillStyle = i % 2 === 0
          ? 'rgba(52, 240, 208, 0.15)'
          : 'rgba(10, 46, 122, 0.2)';
        ctx.fillRect(Math.random() * 230, Math.random() * 480, 18 + Math.random() * 36, 45 + Math.random() * 95);
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 给水面 shader 的岸线轮廓：方块用 (中心, 半宽, 半深)，圆楼用等半径圆。
    function shoreOutline() {
      const shapes = [];
      const EDGE = .55;
      const rectUnion = (rects) => ({
        minX: Math.min(...rects.map(r => r.minX)), maxX: Math.max(...rects.map(r => r.maxX)),
        minZ: Math.min(...rects.map(r => r.minZ)), maxZ: Math.max(...rects.map(r => r.maxZ))
      });
      // 1) 区块地块：地块矩形就是平台与水面相接的地方，搬区块只改 origin，这里自动跟着走。
      for (const zone of gameplay.zones.list) {
        for (const region of zone.regions) {
          const rects = region.rects, u = rectUnion(rects);
          const inside = (x, z) => rects.some(r => x >= r.minX - .001 && x <= r.maxX + .001 && z >= r.minZ - .001 && z <= r.maxZ + .001);
          // 地块的矩形如果拼成一个「占满中心、四个角却是空的」轮廓，说明它在描圆形建筑，
          // 岸线直接用等半径圆，否则方角会在圆楼外面鼓出一个方包。
          const disc = !inside(u.minX, u.minZ) && !inside(u.maxX, u.minZ) && !inside(u.minX, u.maxZ) && !inside(u.maxX, u.maxZ)
            && inside((u.minX + u.maxX) / 2, (u.minZ + u.maxZ) / 2);
          if (disc) {
            // 地块是把圆描成的一圈环，长短半轴会差一截；取平均当半径，取最大会套个大圈。
            const r = ((u.maxX - u.minX) + (u.maxZ - u.minZ)) / 4 + .2;
            shapes.push({ x: (u.minX + u.maxX) / 2, z: (u.minZ + u.maxZ) / 2, hx: r, hz: r, round: true });
          } else {
            // 地块矩形是可站立面，比真实甲板略小一圈；水线要落在甲板外侧的水里才看得见。
            for (const r of rects) shapes.push({ x: (r.minX + r.maxX) / 2, z: (r.minZ + r.maxZ) / 2, hx: (r.maxX - r.minX) / 2 + EDGE, hz: (r.maxZ - r.minZ) / 2 + EDGE });
          }
        }
      }
      // 2) 水街区里露出水面的地标与废墟塔：只取**穿过水面**的那一层，
      //    这样屋顶挑檐、顶部爬藤不会把水纹撑大，沉在水下的屋顶也不会画水线。
      const slice = new THREE.Box3(), unit = new THREE.Box3();
      for (const node of [...waterDistrict.towers, ...waterDistrict.landmarks]) {
        slice.makeEmpty();
        node.updateWorldMatrix(true, true);
        node.traverse((m) => {
          if (!m.isMesh || !m.visible) return;
          unit.setFromObject(m);
          if (unit.min.y > WATER_LEVEL + .06 || unit.max.y < WATER_LEVEL - .06) return;
          slice.union(unit);
        });
        if (slice.isEmpty()) continue;
        shapes.push({
          x: (slice.min.x + slice.max.x) / 2, z: (slice.min.z + slice.max.z) / 2,
          hx: (slice.max.x - slice.min.x) / 2, hz: (slice.max.z - slice.min.z) / 2,
          round: node.name === 'reference-round-garden-building'
        });
      }
      return shapes;
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const dt = t - prevTime;
      prevTime = t;

      globalUniforms.uTime.value = t;

      // 更新阶段二玩法：小人上船、划船远航、靠岸停船、上岸建造与慢节奏经济
      gameplay.updateGameplay(dt, t);
      sceneArt.update(t);

      // 1) 小船动态：靠岸停泊时严格停留在当前位置，仅船身随水波轻微上下起伏，绝不自己乱跑
      if (!window.__playerSailingActive) {
        boatMeshGroup.rotation.z = Math.sin(t * 1.7) * 0.04;

      // 所有停泊点使用同一水位；航行中由 gameplay.js 控制 x/z，不能再被旧首页逻辑拉回。
      boatAnchorGroup.position.y = WATER_LEVEL + Math.sin(t * 2.1) * 0.065;

      // 2) 船体贴边白色水花线呼吸与脉动（紧贴船壳边缘）
      boatEdgeFoams.forEach((bf) => {
        const pulse = 1.0 + Math.sin(t * 2.8 + bf.phase) * 0.06;
        bf.mesh.scale.set(pulse, 0.25, pulse);
        bf.mesh.material.opacity = 0.72 + Math.sin(t * 3.0 + bf.phase) * 0.22;
      });

      // 3) 建筑与平台出水边缘贴边水花条的轻微呼吸
      objectEdgeFoamStrips.forEach((ef) => {
        const s = 1.0 + Math.sin(t * 2.2 + ef.phase) * 0.08;
        ef.mesh.scale.set(ef.baseScaleX * s, 1, ef.baseScaleZ);
        ef.mesh.material.opacity = 0.68 + Math.sin(t * 2.5 + ef.phase) * 0.2;
      });

      poolEdgeFoamSegments.forEach((pf) => {
        pf.mesh.material.opacity = 0.6 + Math.sin(t * 2.4 + pf.phase) * 0.25;
      });

      // 5) 飞鸟盘旋与振翅滑翔动画
      birdsList.forEach((b) => {
        const angle = t * b.speed + b.phase;
        const bx = b.center.x + Math.cos(angle) * b.radiusX;
        const bz = b.center.z + Math.sin(angle) * b.radiusZ;
        const by = b.baseY + Math.sin(t * 1.4 + b.phase) * 0.65;

        // 计算切线朝向，让飞鸟始终顺着飞行轨迹俯冲与转弯倾斜
        const nextAngle = angle + 0.05;
        const nbx = b.center.x + Math.cos(nextAngle) * b.radiusX;
        const nbz = b.center.z + Math.sin(nextAngle) * b.radiusZ;
        b.group.position.set(bx, by, bz);
        b.group.lookAt(nbx, by, nbz);

        // 间歇性振翅与滑翔交替 (Flapping & Gliding)
        const glideMask = 0.45 + 0.55 * Math.sin(t * 1.2 + b.phase);
        const flap = Math.sin(t * b.flapSpeed + b.phase) * 0.55 * glideMask + 0.15;
        b.leftWingPivot.rotation.z = flap;
        b.rightWingPivot.rotation.z = -flap;

        // 水面飞鸟投影跟随
        b.shadowDot.position.set(bx, WATER_LEVEL + 0.02, bz);
      });

      // 6) 悬垂电缆与屋顶/水下植被随风摇曳
      dynamicCables.forEach((cab, idx) => {
        if(!cab.restPositions)return;
        const attr=cab.mesh.geometry.attributes.position;
        for(let v=0;v<attr.count;v++){
          const u=Math.floor(v/9)/32;
          attr.array[v*3+1]=cab.restPositions[v*3+1]+Math.sin(Math.PI*u)*Math.sin(t*.8+u*3+idx)*.065;
        }
        attr.needsUpdate=true;
      });

      swayingPlants.forEach((p) => {
        p.mesh.rotation.z = p.baseRotZ + Math.sin(t * p.speed + p.phase) * p.amp;
      });

      // 7) 水下鱼群环游
      fishList.forEach((f) => {
        const angle = t * f.speed + f.phase;
        const nx = f.center.x + Math.cos(angle) * f.radiusX;
        const nz = f.center.z + Math.sin(angle) * f.radiusZ;
        const ny = f.center.y + Math.sin(t * 1.5 + f.phase) * 0.25;
        f.mesh.lookAt(nx, ny, nz);
        f.mesh.position.set(nx, ny, nz);
      });

      // 8) 阳光微粒缓慢上升
      const posAttr = particleGeo.attributes.position;
      for (let i = 0; i < particleCount; i++) {
        let py = posAttr.getY(i) + 0.008;
        if (py > 12) py = -4;
        posAttr.setY(i, py);
      }
      posAttr.needsUpdate = true;

      // 9) 相机模式更新
      if (!diving.active && cameraMode === 'boat') {
        const desiredTarget = boatAnchorGroup.position.clone().add(new THREE.Vector3(0, 0.6, 0));
        const desiredCamPos = boatAnchorGroup.position.clone().add(new THREE.Vector3(-5.5, 9.5, 9.5));
        controls.target.lerp(desiredTarget, 0.05);
        camera.position.lerp(desiredCamPos, 0.05);
      } else if (!diving.active && cameraMode === 'orbit') {
        const orbitAngle = t * 0.22;
        const r = 28;
        camera.position.x = Math.sin(orbitAngle) * r;
        camera.position.z = Math.cos(orbitAngle) * r;
        camera.position.y = 22 + Math.sin(t * 0.4) * 2.5;
        controls.target.lerp(ORIGINAL_CAM_TARGET, 0.05);
      }

      diving.update(dt, t);
      if (!diving.active) controls.update();
      scene.updateMatrixWorld(true);
      camera.updateMatrixWorld(true);
      harbor.update(t);
      livingHarbor.update(t);
      waterDistrict.update(t);
      waterSystem.update(dt, t);
      gameplay.updateOverlays();
      if (!diving.active) waterSystem.renderUnderwater();
      else diving.renderRefraction();
      const shadowUpdate = renderer.shadowMap.autoUpdate;
      renderer.shadowMap.autoUpdate = diving.active;
      renderer.render(scene, camera);
      renderer.shadowMap.autoUpdate = shadowUpdate;
    }

    animate();
  </script>
</body>
</html>
